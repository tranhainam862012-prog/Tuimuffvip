<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tổng hợp</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
        body{background:#0a0a12;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:24px}
        .card{background:#1a1a2e;border-radius:16px;padding:32px 40px;border:1px solid #2a2a4a;text-align:center;max-width:400px;width:100%}
        .card h2{color:#ffd700;margin-bottom:8px}
        .card p{color:#888;margin-bottom:16px}
        .btn{display:inline-block;padding:12px 24px;background:#f57c00;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:0.2s;margin:4px}
        .btn:hover{background:#e65100}
        .btn-outline{background:transparent;border:1px solid #f57c00;color:#f57c00}
        .btn-outline:hover{background:rgba(245,124,0,0.05)}
        .back{color:#888;margin-top:16px;display:inline-block;text-decoration:none}
        .back:hover{color:#f57c00}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Admin Panel</h2>
        <p>Chọn chức năng quản lí</p>
        <a href="admin_payment.html" class="btn">💰 Xử lý thanh toán</a>
        <a href="admin_users.html" class="btn btn-outline">👥 Quản lý tài khoản</a>
        <br><a href="index.html" class="back">🏠 Quay lại trang chủ</a>
    </div>
</body>
</html>
